<script>
  // The film streams from Mux. Safari plays the stream by itself; other browsers get hls.js, a small open-source
  // player, and only the size the page shows. Some say they can play it themselves and then can't: hls.js then too.
  // No viewer tracking either way.
  const stream = "https://stream.mux.com/DCnfx5K902mAhsEwyORH02yMQuy8ZYXogjqS602QhKj2g00.m3u8";
  const video = document.getElementById("film");
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.addEventListener("error", playWithHls, { once: true });
    video.src = stream;
  } else {
    playWithHls();
  }
  function playWithHls() {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.light.min.js";
    script.integrity = "sha384-y8wQxRLtNclrHbMBLBLTEkgUrdFu6uWzZiobE1wBE09nt2wHIZlBPvPepdZU4+MM";
    script.crossOrigin = "anonymous";
    script.onload = () => {
      if (!window.Hls || !Hls.isSupported()) return;
      const hls = new Hls({ capLevelToPlayerSize: true });
      hls.loadSource(stream);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    };
    document.head.append(script);
  }
</script>
<script type="module">
  // Squircle corners, the continuous curve of iOS, from Lisse (corne.rs); redrawn whenever the film changes size.
  import { generateClipPath, observeResize } from "https://cdn.jsdelivr.net/npm/@lisse/core@0.7.3/dist/index.js";
  const video = document.getElementById("film");
  const shape = () => {
    const { width, height } = video.getBoundingClientRect();
    if (!width || !height) return;
    const radius = Math.round(Math.min(52, Math.max(32, width * 0.056)));
    video.style.clipPath = generateClipPath(width, height, { radius, smoothing: 0.6 });
    video.parentElement.style.borderRadius = `${radius}px`;
    video.classList.add("squircle");
  };
  shape();
  observeResize(video, shape);
</script>
